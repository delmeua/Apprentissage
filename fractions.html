<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>🍬 Les Bonbons Fractions 🍬</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background: radial-gradient(circle, #ff9ff3, #feca57); display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        h1 { font-family: 'Fredoka One', cursive; color: #fff; text-shadow: 4px 4px 0 #ff9f43; font-size: 2.5rem; text-align: center; margin: 10px 0; }
        .top-bar { width: 100%; max-width: 450px; display: flex; justify-content: space-between; margin-bottom: 10px; }
        .lang-buttons button, .btn-exit, .btn-action { font-family: 'Fredoka One', cursive; border: none; border-radius: 16px; cursor: pointer; box-shadow: 0 5px 0 #576574; transition: 0.1s; padding: 10px 18px; font-size: 1rem; }
        .lang-buttons button { background: white; margin-right: 5px; }
        .lang-buttons button.active { background: #00d2d3; color: white; box-shadow: 0 5px 0 #01a3a4; }
        .btn-exit { background: #ff6b6b; color: white; box-shadow: 0 5px 0 #ee5253; text-decoration: none; }
        .game-container { background: white; padding: 25px; border-radius: 32px; box-shadow: 0 15px 30px rgba(0,0,0,0.2); text-align: center; max-width: 400px; width: 100%; border: 6px solid #fff; box-sizing: border-box; transition: 0.3s; }
        .fraction-display { font-family: 'Fredoka One', cursive; font-size: 3.5rem; color: #ff9f43; display: inline-flex; flex-direction: column; align-items: center; background: #fff3e0; padding: 10px 25px; border-radius: 24px; margin: 15px 0; box-shadow: inset 0 4px 8px rgba(0,0,0,0.05); }
        .fraction-line { width: 120%; height: 6px; background: #576574; margin: 4px 0; border-radius: 3px; }
        .candy-box { display: flex; gap: 10px; width: 100%; max-width: 340px; height: 90px; margin: 20px auto; padding: 10px; background: #f1f2f6; border-radius: 20px; box-shadow: inset 0 5px 10px rgba(0,0,0,0.1); box-sizing: border-box; }
        .candy-piece { flex: 1; cursor: pointer; background: #ffffff; border: 3px solid #c8d6e5; border-radius: 14px; transition: all 0.2s; box-shadow: 0 4px 0 #c8d6e5; position: relative; }
        .candy-piece:hover { transform: translateY(-2px); }
        .candy-piece.colored { background: linear-gradient(135deg, #ff4fff, #ff007f) !important; border-color: #ff007f; box-shadow: 0 4px 0 #b30059, inset 0 -4px 8px rgba(0,0,0,0.2); animation: jelly-pop 0.3s ease; }
        .live-counter { font-size: 1.1rem; font-weight: bold; color: #576574; margin-bottom: 10px; }
        .btn-action { background: #10ac84; color: white; box-shadow: 0 6px 0 #108566; font-size: 1.4rem; width: 90%; margin-top: 5px; }
        .feedback-bubble { margin-top: 15px; padding: 12px; border-radius: 16px; font-weight: bold; font-size: 1.2rem; display: none; animation: scaleUp 0.3s ease forwards; }
        .feedback-bubble.correct { display: block; background: #ddf7ed; color: #10ac84; border: 3px dashed #10ac84; }
        .feedback-bubble.incorrect { display: block; background: #ffe3e3; color: #ff6b6b; border: 3px dashed #ff6b6b; }
        .lang-buttons button:active, .btn-exit:active, .btn-action:active { transform: translateY(4px); box-shadow: none !important; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes scaleUp { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes jelly-pop { 0% { transform: scale(1); } 50% { transform: scale(1.15) rotate(3deg); } 100% { transform: scale(1); } }
        .shake { animation: shakeAnim 0.4s ease; }
        @keyframes shakeAnim { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
        .jump { animation: jumpAnim 0.5s ease; }
        @keyframes jumpAnim { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px) scaleY(1.05); } }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="lang-buttons">
            <button id="btn-fr" class="active" onclick="setLanguage('fr')">🇫🇷 FR</button>
            <button id="btn-en" onclick="setLanguage('en')">🇬🇧 EN</button>
        </div>
        <a href="index.html" class="btn-exit" id="text-exit">🚪 Quitter</a>
    </div>
    <h1 id="text-title">🍬 Les Bonbons Fractions !</h1>
    <div class="game-container" id="game-card">
        <div id="text-instruct" style="font-size:1.3rem; font-weight:700; color:#576574;">Colorie la fraction demandée :</div>
        <div class="fraction-display"><span id="num">2</span><div class="fraction-line"></div><span id="den">3</span></div>
        <div class="candy-box" id="candy-container"></div>
        <div class="live-counter" id="live-count-txt">0 / 3 sélectionnés</div>
        <button class="btn-action" onclick="checkAnswer()" id="text-check">Vérifier ! 🎉</button>
        <div class="feedback-bubble" id="feedback-zone"></div>
        <div style="margin-top:15px; font-weight:bold; font-size:1.2rem; color:#ff9f43;"><span id="text-score">Score :</span> <span id="score-val">0</span> ⭐</div>
    </div>
    <script>
        var currentLang='fr', score=0, targetNumerator=2, targetDenominator=3, selectedCount=0;
        var translations = {
            fr: { title: "🍬 Les Bonbons Fractions !", exit: "🚪 Quitter", instruct: "Mange la fraction de bonbons demandée :", check: "Vérifier ! 🎉", score: "Score :", good: "Bravo ! C'est gagné ! 🌟🍬", wrong: "Oups ! Regarde bien le nombre demandé ! 🤔", selected: "sélectionnés" },
            en: { title: "🍬 Candy Fractions!", exit: "🚪 Quit", instruct: "Eat the requested fraction of candies:", check: "Check! 🎉", score: "Score:", good: "Great job! You won! 🌟🍬", wrong: "Oops! Look closely at the fraction! 🤔", selected: "selected" }
        };
        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('btn-fr').className = (lang === 'fr') ? 'active' : '';
            document.getElementById('btn-en').className = (lang === 'en') ? 'active' : '';
            document.getElementById('text-title').innerText = translations[lang].title;
            document.getElementById('text-exit').innerText = translations[lang].exit;
            document.getElementById('text-instruct').innerText = translations[lang].instruct;
            document.getElementById('text-check').innerText = translations[lang].check;
            document.getElementById('text-score').innerText = translations[lang].score;
            updateCounterDisplay();
        }
        function updateCounterDisplay() {
            document.getElementById('live-count-txt').innerText = selectedCount + " / " + targetDenominator + " " + translations[currentLang].selected;
        }
        function nextQuestion() {
            document.getElementById('feedback-zone').className = 'feedback-bubble';
            var texteListe = "2-3-4-5-6";
            var choixDenominateurs = texteListe.split("-");
            targetDenominator = parseInt(choixDenominateurs[Math.floor(Math.random() * choixDenominateurs.length)], 10);
            targetNumerator = Math.floor(Math.random() * (targetDenominator - 1)) + 1;
            document.getElementById('num').innerText = targetNumerator;
            document.getElementById('den').innerText = targetDenominator;
            selectedCount = 0; updateCounterDisplay(); renderCandies(targetDenominator);
        }
        function renderCandies(pieces) {
            var container = document.getElementById('candy-container'); container.innerHTML = '';
            for (var i = 0; i < pieces; i++) {
                var div = document.createElement('div'); div.className = 'candy-piece';
                div.onclick = function() {
                    document.getElementById('feedback-zone').className = 'feedback-bubble';
                    if (this.className === 'candy-piece colored') { this.className = 'candy-piece'; selectedCount--; }
                    else { this.className = 'candy-piece colored'; selectedCount++; }
                    updateCounterDisplay();
                };
                container.appendChild(div);
            }
        }
        function checkAnswer() {
            var feedback = document.getElementById('feedback-zone'), card = document.getElementById('game-card');
            if (selectedCount === targetNumerator) {
                score += 10; document.getElementById('score-val').innerText = score;
                feedback.innerText = translations[currentLang].good; feedback.className = "feedback-bubble correct"; card.className = "game-container jump";
                setTimeout(function(){ card.className = "game-container"; nextQuestion(); }, 1600);
            } else {
                feedback.innerText = translations[currentLang].wrong; feedback.className = "feedback-bubble incorrect"; card.className = "game-container shake";
                setTimeout(function(){ card.className = "game-container"; }, 500);
            }
        }
        nextQuestion();
    </script>
</body>
</html>
