<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questions — gestion</title><style>
*{box-sizing:border-box}body{margin:0;padding:14px;background:#f2efff;color:#292447;font-family:system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;background:#fffdf8;border-radius:20px;overflow:hidden}header{background:linear-gradient(120deg,#6750d8,#9d65e8);color:white;padding:20px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{margin:0}main{padding:18px}.btn{border:0;border-radius:11px;padding:10px 13px;font:inherit;font-weight:800;cursor:pointer;background:#eee9ff;color:#6750d8}.primary{background:#6750d8;color:white}.danger{background:#ffe5eb;color:#a32443}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar input{flex:1;min-width:180px}.note{background:#fff3d2;padding:12px;border-radius:12px}.card{background:white;border:2px solid #e4defc;border-radius:15px;padding:13px;margin:12px 0}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.field label{font-weight:800;display:block;font-size:.9rem;margin-bottom:4px}.field input,.field textarea,.toolbar input{width:100%;font:inherit;padding:9px;border:1px solid #d9d2f5;border-radius:9px}.field textarea{min-height:70px}.wide{grid-column:1/-1}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opt{display:flex;align-items:center;gap:6px}.opt input[type=text]{min-width:0}.opt input[type=radio]{width:auto}.status{color:#17865c;font-weight:800;min-height:22px}@media(max-width:650px){.fields,.opts{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><div class="wrap"><header><div><h1>🧩 Gestion des exercices</h1><p>Ajouter, adapter ou retirer des exercices en français</p></div><button class="btn" id="back">↩ Retour au jeu</button></header><main><p class="note"><b>Important :</b> les changements sont enregistrés dans ce navigateur. Gardez les deux pages sur le même site. Ouvrez d’abord compréhension_lecture.html une fois pour charger la banque initiale.</p><div class="toolbar"><input id="search" placeholder="Rechercher une histoire ou une question"><span id="count"></span><button class="btn primary" id="add">＋ Ajouter</button><button class="btn" id="export">Exporter JSON</button><label class="btn" for="file">Importer JSON</label><input id="file" type="file" accept=".json" hidden></div><div id="status" class="status"></div><div id="list"></div></main></div>
<script src="questions.js"></script><script>
const KEY="lectureQuizQuestionsV1",$=id=>document.getElementById(id);let qs=[];
const clone=x=>JSON.parse(JSON.stringify(x)),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(msg="Modifications enregistrées."){localStorage.setItem(KEY,JSON.stringify(qs));$("status").textContent=msg}
function field(i,k,l,v,wide=false,area=false){return `<div class="field ${wide?"wide":""}"><label>${l}</label>${area?`<textarea data-i="${i}" data-k="${k}">${esc(v)}</textarea>`:`<input data-i="${i}" data-k="${k}" value="${esc(v)}">`}</div>`}
function render(){let term=$("search").value.toLowerCase(),list=$("list");list.innerHTML="";let n=0;qs.forEach((q,i)=>{if(term&&![q.story,q.q].join(" ").toLowerCase().includes(term))return;n++;let card=document.createElement("section");card.className="card";card.innerHTML=`<div class="top"><b>Exercice ${i+1}</b><b>Bonne réponse : ${"ABCD"[q.a]}</b><button class="btn danger" data-remove="${i}">Retirer</button></div><div class="fields">${field(i,"story","Histoire",q.story,true,true)}${field(i,"q","Question",q.q,true)}<div class="field wide"><label>Réponses — sélectionnez la bonne réponse</label><div class="opts">${(q.opts||[]).map((o,j)=>`<div class="opt"><input type="radio" name="c${i}" data-correct="${i}" value="${j}" ${q.a===j?"checked":""}><b>${"ABCD"[j]}</b><input type="text" data-i="${i}" data-k="opts.${j}" value="${esc(o)}"></div>`).join("")}</div></div>${field(i,"h","Indice",q.h,true)}${field(i,"why","Explication / retour oral",q.why,true,true)}</div><p><button class="btn primary" data-save="${i}">Enregistrer</button></p>`;list.appendChild(card)});$("count").textContent=qs.length+" exercices · "+n+" affichés";if(!n)list.textContent="Aucun exercice trouvé."}
function read(i,c){c.querySelectorAll("[data-i]").forEach(e=>{let k=e.dataset.k;if(k.includes(".")){let [a,n]=k.split(".");qs[i][a][+n]=e.value}else qs[i][k]=e.value});let r=c.querySelector("[data-correct]:checked");if(r)qs[i].a=+r.value}
$("list").addEventListener("click",e=>{let r=e.target.closest("[data-remove]");if(r){let i=+r.dataset.remove;if(confirm("Retirer cet exercice ?")){qs.splice(i,1);save("Exercice retiré.");render()}return}let b=e.target.closest("[data-save]");if(b){let i=+b.dataset.save;read(i,b.closest(".card"));save("Exercice enregistré.");render()}});
$("list").addEventListener("change",e=>{if(e.target.matches("[data-correct]")){qs[+e.target.dataset.correct].a=+e.target.value;save("Bonne réponse mise à jour.");render()}});
$("add").onclick=()=>{qs.push({story:"Écrivez une petite histoire.",q:"Écrivez la question.",opts:["Réponse A","Réponse B","Réponse C","Réponse D"],a:0,h:"Écrivez un indice.",why:"Expliquez la bonne réponse."});save("Nouvel exercice ajouté : complétez les champs.");render();scrollTo(0,document.body.scrollHeight)};
$("search").oninput=render;$("export").onclick=()=>{let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(qs,null,2)],{type:"application/json"}));a.href=u;a.download="exercices_lecture.json";a.click();URL.revokeObjectURL(u)};
$("file").onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x)||!x.every(q=>q.story&&q.q&&q.opts?.length===4&&Number.isInteger(q.a)))throw 0;qs=x;save("Banque importée.");render()}catch(err){alert("Fichier JSON invalide.")}e.target.value=""};$("back").onclick=()=>location.href="compréhension_lecture.html";
try{qs=JSON.parse(localStorage.getItem(KEY))||clone(window.QUESTION_BANK||[])}catch(e){qs=clone(window.QUESTION_BANK||[])}if(!localStorage.getItem(KEY))localStorage.setItem(KEY,JSON.stringify(qs));render();
</script></body></html>
