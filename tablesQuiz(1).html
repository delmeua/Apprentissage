<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Times Tables Quiz / Le Quiz Magique des Tables 🚀</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Poppins:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6EE7B7 0%, #3B82F6 100%);
            min-height: 100vh;
        }
        .fun-font {
            font-family: 'Comic Neue', cursive, sans-serif;
        }
        .bounce-in {
            animation: bounceIn 0.5s ease-out;
        }
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen">

    <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-6 md:p-8 max-w-xl w-full text-center border-4 border-yellow-300 relative overflow-hidden bounce-in my-4">
        
        <!-- Décorations -->
        <div class="absolute -top-10 -right-10 bg-yellow-400 w-32 h-32 rounded-full flex items-end justify-start p-4 text-3xl shadow-inner">🦁</div>
        <div class="absolute -bottom-10 -left-10 bg-pink-400 w-32 h-32 rounded-full flex items-start justify-end p-4 text-3xl shadow-inner">⭐</div>

        <!-- Titre & Sous-titre dynamiques -->
        <h1 id="app-title" class="text-3xl md:text-4xl font-extrabold text-indigo-600 mb-2 fun-font tracking-wide">
            Le Quiz Magique des Tables 🎈
        </h1>
        <p id="app-subtitle" class="text-gray-600 mb-6 text-sm md:text-base">
            Apprends en t'amusant ! Parle ou écris ta réponse !
        </p>

        <!-- ÉCRAN DE CONFIGURATION -->
        <div id="setup-screen" class="space-y-6 text-left">
            <!-- Choix de la langue -->
            <div class="bg-indigo-50 p-4 rounded-2xl border-2 border-indigo-200">
                <label id="label-lang" class="block font-bold text-indigo-900 mb-2">🌍 Langue du Quiz / Quiz Language :</label>
                <div class="grid grid-cols-2 gap-4">
                    <button type="button" onclick="setLanguage('fr')" id="btn-lang-fr" class="py-3 px-4 rounded-xl font-bold border-2 border-indigo-500 bg-indigo-600 text-white shadow-md transition transform hover:scale-105">Français 🇧🇪</button>
                    <button type="button" onclick="setLanguage('en')" id="btn-lang-en" class="py-3 px-4 rounded-xl font-bold border-2 border-gray-300 bg-white text-gray-700 shadow-sm transition transform hover:scale-105">English 🇬🇧</button>
                </div>
            </div>

            <!-- Choix du mode de tables -->
            <div class="bg-pink-50 p-4 rounded-2xl border-2 border-pink-200">
                <label class="block font-bold text-pink-900 mb-2" id="label-mode">Comment veux-tu travailler ?</label>
                <div class="grid grid-cols-3 gap-2 mb-4">
                    <button type="button" onclick="selectMode('all')" id="btn-mode-all" class="py-2 px-2 text-xs md:text-sm rounded-xl font-bold border-2 border-indigo-500 bg-indigo-600 text-white shadow transition">🌟 Toutes (1-10)</button>
                    <button type="button" onclick="selectMode('single')" id="btn-mode-single" class="py-2 px-2 text-xs md:text-sm rounded-xl font-bold border-2 border-gray-300 bg-white text-gray-700 shadow transition">🎯 Une table</button>
                    <button type="button" onclick="selectMode('range')" id="btn-mode-range" class="py-2 px-2 text-xs md:text-sm rounded-xl font-bold border-2 border-gray-300 bg-white text-gray-700 shadow transition">🛤️ Une plage</button>
                </div>

                <!-- Option A: Une table précise -->
                <div id="box-single" class="hidden bg-white p-3 rounded-xl border border-pink-300">
                    <label class="block font-bold text-indigo-900 text-sm mb-2" id="label-single">Choisis la table :</label>
                    <select id="select-single" class="w-full p-2 rounded-lg border-2 border-indigo-300 font-bold text-lg bg-indigo-50 text-indigo-900"></select>
                </div>

                <!-- Option B: Une plage de tables -->
                <div id="box-range" class="hidden bg-white p-3 rounded-xl border border-pink-300">
                    <label class="block font-bold text-indigo-900 text-sm mb-2" id="label-range">De la table ... à la table ... :</label>
                    <div class="flex items-center gap-2">
                        <select id="select-range-min" class="w-1/2 p-2 rounded-lg border-2 border-indigo-300 font-bold text-lg bg-indigo-50 text-indigo-900"></select>
                        <span class="font-bold text-pink-600" id="label-to">à</span>
                        <select id="select-range-max" class="w-1/2 p-2 rounded-lg border-2 border-indigo-300 font-bold text-lg bg-indigo-50 text-indigo-900"></select>
                    </div>
                </div>
            </div>

            <button onclick="startQuiz()" id="btn-start" class="w-full py-4 bg-gradient-to-r from-green-400 to-emerald-500 text-white font-extrabold text-xl rounded-2xl shadow-lg hover:from-green-500 hover:to-emerald-600 transition transform hover:scale-105 fun-font">
                🚀 C'est parti !
            </button>
        </div>

        <!-- ÉCRAN DU QUIZ -->
        <div id="quiz-screen" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-indigo-100 px-4 py-2 rounded-xl">
                <span id="progress-text" class="font-bold text-indigo-800 text-sm md:text-base">Question 1 / 10</span>
                <span id="score-badge" class="bg-yellow-400 text-yellow-900 px-3 py-1 rounded-full font-bold text-sm">Score: 0/0</span>
            </div>

            <div class="py-6">
                <h2 id="question-text" class="text-4xl md:text-5xl font-extrabold text-indigo-900 mb-2 fun-font"></h2>
                <div class="flex justify-center items-center gap-2 text-indigo-600 text-sm md:text-base font-semibold mt-2">
                    <span id="mic-icon" class="animate-pulse text-xl">🎙️</span> 
                    <span id="mic-status">Micro prêt... Parle ou tape ta réponse !</span>
                </div>
            </div>

            <form onsubmit="submitAnswer(event)" class="space-y-4">
                <input type="text" id="answer-input" autocomplete="off" autofocus placeholder="Réponds ici..." 
                    class="w-full p-4 text-center text-3xl font-extrabold rounded-2xl border-4 border-indigo-300 focus:border-indigo-500 focus:outline-none shadow-inner text-indigo-800">
                <button type="submit" id="btn-submit" class="w-full py-3 bg-indigo-600 text-white font-bold text-lg rounded-xl shadow hover:bg-indigo-700 transition">
                    Valider 🎯
                </button>
            </form>

            <div id="feedback-box" class="p-4 rounded-2xl text-xl font-bold hidden"></div>
        </div>

        <!-- ÉCRAN DES RÉSULTATS -->
        <div id="result-screen" class="hidden space-y-6">
            <div class="text-5xl mb-1">🏆</div>
            <h2 id="result-title" class="text-3xl font-extrabold text-indigo-900 fun-font">Partie terminée !</h2>
            <p id="result-score" class="text-2xl text-indigo-700 font-extrabold"></p>
            
            <div id="result-message" class="p-3 bg-yellow-100 rounded-2xl text-yellow-900 font-bold text-base"></div>

            <div class="text-left bg-indigo-50/80 p-4 rounded-2xl border-2 border-indigo-100 max-h-60 overflow-y-auto">
                <h3 class="font-bold text-indigo-900 mb-3 text-center" id="summary-title">📜 Récapitulatif :</h3>
                <div id="summary-list" class="space-y-2 text-sm md:text-base"></div>
            </div>

            <button onclick="resetApp()" id="btn-replay" class="w-full py-4 bg-gradient-to-r from-purple-500 to-indigo-600 text-white font-extrabold text-xl rounded-2xl shadow-lg hover:from-purple-600 hover:to-indigo-700 transition transform hover:scale-105 fun-font">
                🔄 Rejouer
            </button>
        </div>

    </div>

    <script>
        let currentLang = 'fr';
        let currentMode = 'all';
        let questions = [];
        let userAnswers = [];
        let currentIndex = 0;
        let score = 0;
        let recognition = null;
        let isWaitingForNext = false;
        let availableVoices = [];

        function loadVoices() {
            if ('speechSynthesis' in window) {
                availableVoices = window.speechSynthesis.getVoices();
            }
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        const translations = {
            fr: {
                appTitle: "Le Quiz Magique des Tables 🎈",
                appSubtitle: "Apprends en t'amusant ! Parle ou écris ta réponse !",
                modeLabel: "Comment veux-tu travailler ?",
                btnAll: "🌟 Toutes (1-10)",
                btnSingle: "🎯 Une table",
                btnRange: "🛤️ Une plage",
                singleLabel: "Choisis la table :",
                rangeLabel: "De la table ... à la table ... :",
                toLabel: "à",
                btnStart: "🚀 C'est parti !",
                progress: "Question",
                score: "Score",
                placeholder: "Réponds ici...",
                btnSubmit: "Valider 🎯",
                btnReplay: "🔄 Rejouer",
                micListening: "🔴 Le micro t'écoute... Parle ou tape ta réponse !",
                micWait: "⏳ Patienter...",
                correct: "🎉 Bravo ! C'est la bonne réponse !",
                incorrect: "❌ Oups ! La bonne réponse était : ",
                resultsTitle: "Partie terminée !",
                finalScore: "Ton score final",
                summaryTitle: "📜 Récapitulatif de tes réponses :",
                perfect: "Incroyable ! C'est un sans-faute ! 🌟",
                good: "Super travail ! Continue comme ça ! 👍",
                tryAgain: "Tu peux encore t'entraîner, tu vas y arriver ! 💪",
                tablePrefix: "Table de "
            },
            en: {
                appTitle: "Magic Times Tables Quiz 🎈",
                appSubtitle: "Have fun learning! Speak or type your answer!",
                modeLabel: "Choose how to practice:",
                btnAll: "🌟 All (1-10)",
                btnSingle: "🎯 One table",
                btnRange: "🛤️ A range",
                singleLabel: "Choose the table:",
                rangeLabel: "From table ... to table ...:",
                toLabel: "to",
                btnStart: "🚀 Let's go!",
                progress: "Question",
                score: "Score",
                placeholder: "Type your answer here...",
                btnSubmit: "Submit 🎯",
                btnReplay: "🔄 Play Again",
                micListening: "🔴 Microphone listening... Speak or type your answer!",
                micWait: "⏳ Please wait...",
                correct: "🎉 Awesome! Correct answer!",
                incorrect: "❌ Oops! The correct answer was: ",
                resultsTitle: "Quiz Complete!",
                finalScore: "Your final score",
                summaryTitle: "📜 Summary of your answers:",
                perfect: "Incredible! Perfect score! 🌟",
                good: "Great job! Keep it up! 👍",
                tryAgain: "Keep practicing, you'll get it! 💪",
                tablePrefix: "Table of "
            }
        };

        window.onload = function() {
            populateSelects();
            updateTexts();
        };

        function setLanguage(lang) {
            currentLang = lang;
            if (lang === 'fr') {
                document.getElementById('btn-lang-fr').className = "py-3 px-4 rounded-xl font-bold border-2 border-indigo-500 bg-indigo-600 text-white shadow-md transition transform hover:scale-105";
                document.getElementById('btn-lang-en').className = "py-3 px-4 rounded-xl font-bold border-2 border-gray-300 bg-white text-gray-700 shadow-sm transition transform hover:scale-105";
            } else {
                document.getElementById('btn-lang-en').className = "py-3 px-4 rounded-xl font-bold border-2 border-indigo-500 bg-indigo-600 text-white shadow-md transition transform hover:scale-105";
                document.getElementById('btn-lang-fr').className = "py-3 px-4 rounded-xl font-bold border-2 border-gray-300 bg-white text-gray-700 shadow-sm transition transform hover:scale-105";
            }
            populateSelects();
            updateTexts();
        }

        function populateSelects() {
            const t = translations[currentLang];
            const singleSelect = document.getElementById('select-single');
            const minSelect = document.getElementById('select-range-min');
            const maxSelect = document.getElementById('select-range-max');

            const prevSingle = singleSelect.value || "5";
            const prevMin = minSelect.value || "2";
            const prevMax = maxSelect.value || "5";

            singleSelect.innerHTML = '';
            minSelect.innerHTML = '';
            maxSelect.innerHTML = '';

            for (let i = 1; i <= 10; i++) {
                singleSelect.innerHTML += `<option value="${i}" ${i == prevSingle ? 'selected' : ''}>${t.tablePrefix}${i}</option>`;
                minSelect.innerHTML += `<option value="${i}" ${i == prevMin ? 'selected' : ''}>${t.tablePrefix}${i}</option>`;
                maxSelect.innerHTML += `<option value="${i}" ${i == prevMax ? 'selected' : ''}>${t.tablePrefix}${i}</option>`;
            }
        }

        function updateTexts() {
            const t = translations[currentLang];
            
            document.getElementById('app-title').innerText = t.appTitle;
            document.getElementById('app-subtitle').innerText = t.appSubtitle;

            document.getElementById('label-mode').innerText = t.modeLabel;
            document.getElementById('btn-mode-all').innerText = t.btnAll;
            document.getElementById('btn-mode-single').innerText = t.btnSingle;
            document.getElementById('btn-mode-range').innerText = t.btnRange;

            document.getElementById('label-single').innerText = t.singleLabel;
            document.getElementById('label-range').innerText = t.rangeLabel;
            document.getElementById('label-to').innerText = t.toLabel;

            document.getElementById('btn-start').innerText = t.btnStart;
            document.getElementById('answer-input').placeholder = t.placeholder;
            document.getElementById('btn-submit').innerText = t.btnSubmit;
            document.getElementById('mic-status').innerText = isWaitingForNext ? t.micWait : t.micListening;
            
            document.getElementById('summary-title').innerText = t.summaryTitle;
            document.getElementById('btn-replay').innerText = t.btnReplay;
        }

        function selectMode(mode) {
            currentMode = mode;
            const btnAll = document.getElementById('btn-mode-all');
            const btnSingle = document.getElementById('btn-mode-single');
            const btnRange = document.getElementById('btn-mode-range');
            
            const boxSingle = document.getElementById('box-single');
            const boxRange = document.getElementById('box-range');

            const activeStyle = "py-2 px-2 text-xs md:text-sm rounded-xl font-bold border-2 border-indigo-500 bg-indigo-600 text-white shadow transition";
            const inactiveStyle = "py-2 px-2 text-xs md:text-sm rounded-xl font-bold border-2 border-gray-300 bg-white text-gray-700 shadow transition";

            btnAll.className = mode === 'all' ? activeStyle : inactiveStyle;
            btnSingle.className = mode === 'single' ? activeStyle : inactiveStyle;
            btnRange.className = mode === 'range' ? activeStyle : inactiveStyle;

            if (mode === 'single') {
                boxSingle.classList.remove('hidden');
                boxRange.classList.add('hidden');
            } else if (mode === 'range') {
                boxSingle.classList.add('hidden');
                boxRange.classList.remove('hidden');
            } else {
                boxSingle.classList.add('hidden');
                boxRange.classList.add('hidden');
            }
        }

        function numberToBelgianText(n) {
            if (n === 70) return "septante";
            if (n === 71) return "septante et un";
            if (n === 72) return "septante deux";
            if (n === 73) return "septante trois";
            if (n === 74) return "septante quatre";
            if (n === 75) return "septante cinq";
            if (n === 76) return "septante six";
            if (n === 77) return "septante sept";
            if (n === 78) return "septante huit";
            if (n === 79) return "septante neuf";
            if (n === 90) return "nonante";
            if (n === 91) return "nonante et un";
            if (n === 92) return "nonante deux";
            if (n === 93) return "nonante trois";
            if (n === 94) return "nonante quatre";
            if (n === 95) return "nonante cinq";
            if (n === 96) return "nonante six";
            if (n === 97) return "nonante sept";
            if (n === 98) return "nonante huit";
            if (n === 99) return "nonante neuf";
            return n.toString();
        }

        function parseBelgianSpeech(str) {
            let text = str.toLowerCase().trim();
            const numbers = text.match(/\d+/g);
            if (numbers && numbers.length > 0) {
                return parseInt(numbers[numbers.length - 1]);
            }

            if (text.includes("septante et un")) return 71;
            if (text.includes("septante deux")) return 72;
            if (text.includes("septante trois")) return 73;
            if (text.includes("septante quatre")) return 74;
            if (text.includes("septante cinq")) return 75;
            if (text.includes("septante six")) return 76;
            if (text.includes("septante sept")) return 77;
            if (text.includes("septante huit")) return 78;
            if (text.includes("septante neuf")) return 79;
            if (text.includes("septante")) return 70;

            if (text.includes("nonante et un")) return 91;
            if (text.includes("nonante deux")) return 92;
            if (text.includes("nonante trois")) return 93;
            if (text.includes("nonante quatre")) return 94;
            if (text.includes("nonante cinq")) return 95;
            if (text.includes("nonante six")) return 96;
            if (text.includes("nonante sept")) return 97;
            if (text.includes("nonante huit")) return 98;
            if (text.includes("nonante neuf")) return 99;
            if (text.includes("nonante")) return 90;

            return NaN;
        }

        function startQuiz() {
            let availablePairs = [];
            let minT = 1, maxT = 10;

            if (currentMode === 'single') {
                minT = maxT = parseInt(document.getElementById('select-single').value) || 1;
            } else if (currentMode === 'range') {
                minT = parseInt(document.getElementById('select-range-min').value) || 1;
                maxT = parseInt(document.getElementById('select-range-max').value) || 10;
                if (minT > maxT) { let temp = minT; minT = maxT; maxT = temp; }
            }

            for (let t = minT; t <= maxT; t++) {
                for (let m = 1; m <= 10; m++) {
                    availablePairs.push({ a: t, b: m });
                }
            }

            availablePairs.sort(() => Math.random() - 0.5);
            questions = availablePairs.slice(0, 10);
            userAnswers = [];
            
            currentIndex = 0;
            score = 0;

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');

            loadQuestion();
        }

        function loadQuestion() {
            // 1. Stopper et détruire l'ancienne instance du micro pour vider tout résidu en mémoire
            if (recognition) {
                try { recognition.abort(); } catch(e){}
                recognition = null;
            }

            isWaitingForNext = false;
            const inputElem = document.getElementById('answer-input');
            inputElem.value = '';
            inputElem.disabled = false;
            document.getElementById('feedback-box').classList.add('hidden');
            inputElem.focus();

            const q = questions[currentIndex];
            const t = translations[currentLang];
            
            document.getElementById('progress-text').innerText = `${t.progress} ${currentIndex + 1} / 10`;
            document.getElementById('score-badge').innerText = `${t.score}: ${score}/${currentIndex}`;
            document.getElementById('mic-status').innerText = t.micListening;

            const questionString = `${q.a} × ${q.b} = ?`;
            const speechString = currentLang === 'fr' 
                ? `Combien font ${q.a} fois ${q.b} ?` 
                : `What is ${q.a} times ${q.b}?`;

            document.getElementById('question-text').innerText = questionString;
            
            // 2. Énoncer la question, puis initialiser un nouveau micro propre
            speakText(speechString, function() {
                initFreshSpeechRecognition();
            });
        }

        function speakText(text, onEndCallback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                
                const targetLang = currentLang === 'fr' ? 'fr' : 'en';
                utterance.lang = currentLang === 'fr' ? 'fr-BE' : 'en-US';

                if (availableVoices.length === 0) {
                    availableVoices = window.speechSynthesis.getVoices();
                }

                let chosenVoice = availableVoices.find(v => v.lang.startsWith(targetLang) && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Belgium') || v.name.includes('fr_BE')));
                if (!chosenVoice) {
                    chosenVoice = availableVoices.find(v => v.lang.startsWith(targetLang));
                }

                if (chosenVoice) {
                    utterance.voice = chosenVoice;
                }

                utterance.rate = 0.88;
                utterance.pitch = 1.25;

                utterance.onend = function() {
                    if (onEndCallback) onEndCallback();
                };

                utterance.onerror = function() {
                    if (onEndCallback) onEndCallback();
                };

                window.speechSynthesis.speak(utterance);
            } else {
                if (onEndCallback) onEndCallback();
            }
        }

        function initFreshSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition || isWaitingForNext) return;

            recognition = new SpeechRecognition();
            recognition.lang = currentLang === 'fr' ? 'fr-BE' : 'en-US';
            recognition.continuous = false; // Mode ponctuel par question pour éviter toute rémanence
            recognition.interimResults = false;

            recognition.onresult = function(event) {
                if (isWaitingForNext) return;
                const speechResult = event.results[0][0].transcript;
                const val = parseBelgianSpeech(speechResult);

                if (!isNaN(val)) {
                    const inputElem = document.getElementById('answer-input');
                    inputElem.value = val;
                    submitAnswer(new Event('submit'));
                }
            };

            recognition.onerror = function() {};

            recognition.onend = function() {
                // Relance automatique uniquement si on n'a pas encore validé
                if (!isWaitingForNext && recognition) {
                    try { recognition.start(); } catch(e){}
                }
            };

            try {
                recognition.start();
            } catch(e) {}
        }

        function submitAnswer(e) {
            e.preventDefault();
            if (isWaitingForNext) return;

            const inputElem = document.getElementById('answer-input');
            const userVal = parseInt(inputElem.value.trim());
            if (isNaN(userVal)) return;

            isWaitingForNext = true;
            inputElem.disabled = true;

            // Couper immédiatement le micro pour bloquer toute autre saisie vocale parasite
            if (recognition) {
                try { recognition.abort(); } catch(e){}
                recognition = null;
            }

            const q = questions[currentIndex];
            const correctVal = q.a * q.b;
            const isCorrect = userVal === correctVal;

            userAnswers.push({
                a: q.a,
                b: q.b,
                given: userVal,
                correct: correctVal,
                isCorrect: isCorrect
            });

            const t = translations[currentLang];
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.classList.remove('hidden');

            document.getElementById('mic-status').innerText = t.micWait;

            const spokenCorrectVal = currentLang === 'fr' ? numberToBelgianText(correctVal) : correctVal;

            if (isCorrect) {
                score++;
                feedbackBox.className = "p-4 rounded-2xl text-xl font-bold bg-green-100 text-green-700 border-2 border-green-300 bounce-in";
                feedbackBox.innerText = t.correct;
                
                speakText(currentLang === 'fr' ? "Bravo !" : "Correct!", function() {
                    proceedToNext();
                });
            } else {
                feedbackBox.className = "p-4 rounded-2xl text-xl font-bold bg-red-100 text-red-600 border-2 border-red-300 bounce-in";
                feedbackBox.innerText = `${t.incorrect} ${correctVal}`;
                
                const oralCorrection = currentLang === 'fr' 
                    ? `Dommage. La bonne réponse était ${spokenCorrectVal}.` 
                    : `Too bad. The correct answer was ${correctVal}.`;

                speakText(oralCorrection, function() {
                    proceedToNext();
                });
            }
        }

        function proceedToNext() {
            currentIndex++;
            if (currentIndex < 10) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            if (recognition) {
                try { recognition.abort(); } catch(e){}
                recognition = null;
            }
            window.speechSynthesis.cancel();

            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            const t = translations[currentLang];
            document.getElementById('result-title').innerText = t.resultsTitle;
            document.getElementById('result-score').innerText = `${t.finalScore} : ${score} / 10`;

            let msg = t.tryAgain;
            if (score === 10) msg = t.perfect;
            else if (score >= 7) msg = t.good;

            document.getElementById('result-message').innerText = msg;

            const summaryContainer = document.getElementById('summary-list');
            summaryContainer.innerHTML = '';

            userAnswers.forEach((ans, idx) => {
                const item = document.createElement('div');
                item.className = "flex justify-between items-center p-2 rounded-xl border font-bold " + 
                    (ans.isCorrect ? "bg-green-100 border-green-300 text-green-800" : "bg-red-100 border-red-300 text-red-800");

                if (ans.isCorrect) {
                    item.innerHTML = `
                        <span>Q${idx + 1}: ${ans.a} × ${ans.b}</span>
                        <span>${ans.given} ✅</span>
                    `;
                } else {
                    item.innerHTML = `
                        <span>Q${idx + 1}: ${ans.a} × ${ans.b}</span>
                        <span>
                            <span class="text-red-600 line-through mr-2">${ans.given}</span>
                            <span class="text-green-700 font-extrabold">${ans.correct}</span> ✅
                        </span>
                    `;
                }
                summaryContainer.appendChild(item);
            });

            speakText(msg);
        }

        function resetApp() {
            if (recognition) {
                try { recognition.abort(); } catch(e){}
                recognition = null;
            }
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
            selectMode('all');
            updateTexts();
        }
    </script>
</body>
</html>
